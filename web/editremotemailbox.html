<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content>
    <meta name="author" content="Steve Goodman">
    <title>Exchange Recipient Admin Center - Edit Remote Mailbox</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <link href="dashboard.css" rel="stylesheet">
  </head>
  <body>
    <header
      class="navbar navbar-dark sticky-top bg-dark flex-md-nowrap p-0 shadow">
      <a class="navbar-brand col-md-3 col-lg-2 me-0 px-3" href="#">Exchange
        Recipient Admin Center</a>
      <button class="navbar-toggler position-absolute d-md-none collapsed"
        type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu"
        aria-controls="sidebarMenu" aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="navbar-nav">
        <div class="nav-item text-nowrap">
          <a class="nav-link px-3" href="/exit">Exit</a>
        </div>
      </div>
    </header>

    <div class="container-fluid">
      <div class="row">
        <nav id="sidebarMenu"
          class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
          <div class="position-sticky pt-3">
            <ul class="nav flex-column">
              <li class="nav-item">
                <a class="nav-link" aria-current="page" href="/">
                  <span data-feather="home"></span>
                  Dashboard
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="/remotemailboxes">
                  <span data-feather="user"></span>
                  Remote Mailboxes
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/distributiongroups">
                  <span data-feather="users"></span>
                  Distribution Groups
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/contacts">
                  <span data-feather="mail"></span>
                  Contacts
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/emailaddresspolicies">
                  <span data-feather="list"></span>
                  Email Address Policies
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/accepteddomains">
                  <span data-feather="layers"></span>
                  Accepted Domains
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="https://admin.exchange.microsoft.com/"
                  target="_blank">
                  <span data-feather="external-link"></span>
                  Exchange Admin Center
                </a>
              </li>
            </ul>
          </div>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
          <div
            class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h2 class="h2">Edit Remote Mailbox</h2>
          </div>

          <form method="post" action="/editremotemailbox">
            <div class="mb-3">
              <label for="DisplayName" class="form-label">Display Name</label>
              <input type="text" class="form-control" id="DisplayName"
                name="DisplayName" value="{DisplayName}">
            </div>
            <div class="mb-3">
              <label for="PrimarySmtpAddress" class="form-label">Primary SMTP
                Address</label>
              <input type="email" class="form-control" id="PrimarySmtpAddress"
                name="PrimarySmtpAddress" value="{PrimarySmtpAddress}">
            </div>
            <div class="mb-3">
              <label for="Alias" class="form-label">Alias</label>
              <input type="text" class="form-control" id="Alias" name="Alias"
                value="{Alias}">
            </div>
            <div class="mb-3">
              <label for="RemoteRoutingAddress" class="form-label">Remote
                Routing Address</label>
              <input type="email" class="form-control" id="RemoteRoutingAddress"
                name="RemoteRoutingAddress" value="{RemoteRoutingAddress}">
            </div>
            <button type="submit" class="btn btn-primary">Update Remote
              Mailbox</button>
          </form>
        </main>
      </div>
    </div>

    <script>
      feather.replace()
    </script>
  </body>
</html>
